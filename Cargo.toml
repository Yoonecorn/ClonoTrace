[workspace]
resolver = "2"
members = [
    "crates/clonotrace-cli",
    "crates/clonotrace-extended",
    "crates/clonotrace-airr",
    "crates/clonotrace-group",
    "crates/clonotrace-distance",
    "crates/clonotrace-cluster",
    "crates/clonotrace-spectral",
    "crates/clonotrace-germline",
    "crates/clonotrace-exec",
    "crates/clonotrace-report",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
flate2 = "=1.1.9"
rayon = "=1.12.0"
clap = { version = "=4.6.6", features = ["derive"] }
tempfile = "=3.27.0"
libc = "=0.2.189"
memchr = "=2.8.3"
